# Kind cluster configuration for local AI-RAN development
# Creates a 5-node cluster with appropriate labels

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ai-ran-dev
nodes:
  # Control plane
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  
  # RAN node 1 - for srsran, ricplt, ricxapp
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ran=true"
  
  # RAN node 2 - for srsran, ricplt, ricxapp
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ran=true"
  
  # GPU + Computing node - for AI inference with GPU
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "gpu=true,computing=true"
  
  # Computing node - CPU only (fallback)
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "computing=true"
