---
# ============================================
# LOW PRIORITY: ai-workloads namespace (gpu/computing nodes)
# Horizontal scaling only
# Subject to deferral during RAN traffic peaks
# ============================================

apiVersion: airan.io/v1alpha1
kind: QoSAwareWorkload
metadata:
  name: inference-standard-gpu
  namespace: ai-workloads
  labels:
    app.kubernetes.io/name: inference-standard-gpu
    airan.io/priority: low
spec:
  workloadRef:
    kind: Deployment
    name: inference-standard-gpu
  
  qosLevel: low
  
  slaTarget:
    latencyMs: 1000  # Best-effort
  
  placement:
    requiredNodeLabels:
      - computing
    preferredNodeLabels:
      - gpu
    antiAffinityLabels:
      - ran  # Avoid RAN-only nodes
  
  scaling:
    vertical:
      enabled: false  # Non-RAN: no vertical
    horizontal:
      enabled: true   # Non-RAN: horizontal only
      minReplicas: 1
      maxReplicas: 5
  
  gpuRequirements:
    count: 1
  
  proactiveConfig:
    gpuFallbackToCPU: true      # Fallback if GPU unavailable
    postponeDuringPeak: true    # DEFER during RAN traffic peaks
  
  digitalTwin:
    enabled: true
    predictionHorizonMinutes: 60

---
apiVersion: airan.io/v1alpha1
kind: QoSAwareWorkload
metadata:
  name: training-large-gpu
  namespace: ai-workloads
  labels:
    app.kubernetes.io/name: training-large-gpu
    airan.io/priority: low
spec:
  workloadRef:
    kind: Deployment
    name: training-large-gpu
  
  qosLevel: low
  
  slaTarget:
    latencyMs: 30000  # 30 seconds - very tolerant for training
  
  placement:
    requiredNodeLabels:
      - computing
      - gpu
    antiAffinityLabels:
      - ran
  
  scaling:
    vertical:
      enabled: false
    horizontal:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
  
  gpuRequirements:
    count: 1
  
  proactiveConfig:
    gpuFallbackToCPU: false     # Training needs GPU
    postponeDuringPeak: true    # DEFER during RAN peaks
  
  digitalTwin:
    enabled: true
    predictionHorizonMinutes: 60
