# QoSAwareWorkload definitions for ACTUAL deployed workloads
# Based on: kubectl get pod -A

---
# ============================================
# HIGH PRIORITY: srsran namespace (ran=true nodes)
# Vertical scaling only
# ============================================

apiVersion: airan.io/v1alpha1
kind: QoSAwareWorkload
metadata:
  name: srsran-gnb
  namespace: srsran
  labels:
    app.kubernetes.io/name: srsran-gnb
    airan.io/priority: high
spec:
  workloadRef:
    kind: Deployment
    name: srsran-gnb
  
  qosLevel: high
  
  slaTarget:
    latencyMs: 10  # Critical near-RT requirement
  
  placement:
    requiredNodeLabels:
      - ran
  
  scaling:
    vertical:
      enabled: true
      minResources:
        cpu: "2"
        memory: "4Gi"
      maxResources:
        cpu: "16"
        memory: "32Gi"
    horizontal:
      enabled: false  # RAN: vertical only
  
  digitalTwin:
    enabled: true
    predictionHorizonMinutes: 60
  
  metricsSource:
    type: prometheus
    latencyMetricName: "srsran_gnb_processing_latency_ms"

