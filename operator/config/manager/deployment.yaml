apiVersion: v1
kind: Namespace
metadata:
  name: airan-system
  labels:
    app.kubernetes.io/name: ai-ran-orchestrator
    app.kubernetes.io/component: orchestrator

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ran-orchestrator
  namespace: airan-system
  labels:
    app.kubernetes.io/name: ai-ran-orchestrator
    app.kubernetes.io/component: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-ran-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-ran-orchestrator
        app.kubernetes.io/component: orchestrator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: ai-ran-orchestrator
      containers:
        - name: orchestrator
          image: ai-ran-orchestrator:latest
          imagePullPolicy: IfNotPresent
          args:
            - -digital-twin-address=digital-twin-service.airan-system:50051
            - -reconciliation-period=30s
            - -prometheus-url=http://prometheus-k8s.monitoring:9090
            - -v=2
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/hostname: smontebu-master
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

---
apiVersion: v1
kind: Service
metadata:
  name: ai-ran-orchestrator
  namespace: airan-system
  labels:
    app.kubernetes.io/name: ai-ran-orchestrator
spec:
  selector:
    app.kubernetes.io/name: ai-ran-orchestrator
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
